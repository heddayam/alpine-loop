name: alpine-loop

services:
  packs:
    profiles: [tools]
    build:
      context: .
      target: packs
    init: true
    user: "${ALPINE_UID:-1000}:${ALPINE_GID:-1000}"
    environment:
      ALPINE_ROUTE_JOBS_DB: /app/.local-data/runtime/route-jobs.sqlite
      ALPINE_NATIVE_ROUTE_JOBS_DB: /app/.local-data/native-runtime/route-jobs.sqlite
    volumes:
      - ./.cache:/app/.cache
      - ./.local-data/packs:/app/.local-data/packs
      - ./.local-data/runtime:/app/.local-data/native-runtime:ro
      - alpine-runtime:/app/.local-data/runtime:ro

  app:
    build:
      context: .
      target: runtime
    init: true
    ports:
      - "${ALPINE_BIND_ADDRESS:-127.0.0.1}:${ALPINE_PORT:-3000}:3000"
    environment:
      ARCGIS_API_KEY: "${ARCGIS_API_KEY:-}"
      ARCGIS_GEOCODING_API_KEY: "${ARCGIS_GEOCODING_API_KEY:-}"
      ARCGIS_ROUTING_API_KEY: "${ARCGIS_ROUTING_API_KEY:-}"
      ALPINE_PACK_ROOT: /app/.local-data/packs
      ALPINE_PROVIDER_USAGE_DB: /app/.local-data/runtime/provider-usage.sqlite
      ALPINE_ROUTE_JOBS_DB: /app/.local-data/runtime/route-jobs.sqlite
    volumes:
      - ./.local-data/packs:/app/.local-data/packs:ro
      - alpine-runtime:/app/.local-data/runtime

volumes:
  alpine-runtime:
