name: alpine-loop

services:
  data:
    profiles: [tools]
    build:
      context: .
      target: developer
    init: true
    user: "${ALPINE_UID:-1000}:${ALPINE_GID:-1000}"
    mem_limit: 4g
    memswap_limit: 4g
    environment:
      ALPINE_SOURCE_CACHE: /app/.cache/sources
      ALPINE_COVERAGE_ROOT: /app/.cache/build
      ALPINE_RELEASE_ROOT: /app/.local-data/releases/prepared
    volumes:
      - ./.cache:/app/.cache
      - ./.local-data/releases:/app/.local-data/releases

  app:
    build:
      context: .
      target: runtime
    init: true
    ports:
      - "${ALPINE_BIND_ADDRESS:-127.0.0.1}:${ALPINE_PORT:-3000}:3000"
    environment:
      ALPINE_SOLVER_WORKERS: "${ALPINE_SOLVER_WORKERS:-}"
      ARCGIS_API_KEY: "${ARCGIS_API_KEY:-}"
      ARCGIS_GEOCODING_API_KEY: "${ARCGIS_GEOCODING_API_KEY:-}"
      ARCGIS_ROUTING_API_KEY: "${ARCGIS_ROUTING_API_KEY:-}"
      ALPINE_PROVIDER_USAGE_DB: /app/.local-data/runtime/provider-usage.sqlite
      ALPINE_ROUTE_JOBS_DB: /app/.local-data/runtime/route-jobs.sqlite
      ALPINE_COVERAGE_ROOT: /app/.local-data/runtime/coverage
      ALPINE_COVERAGE_CATALOG: "${ALPINE_COVERAGE_CATALOG:-/app/.local-data/releases/prepared}"
    volumes:
      - ./.local-data/releases:/app/.local-data/releases:ro
      - alpine-runtime:/app/.local-data/runtime

volumes:
  alpine-runtime:
